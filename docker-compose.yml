version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    container_name: pfarm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: phonefarm
      POSTGRES_USER: pfarm
      POSTGRES_PASSWORD: pfarm_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfarm -d phonefarm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pfarm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_secret
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pfarm-backend
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://pfarm:pfarm_secret@postgres:5432/phonefarm
      REDIS_URL: redis://:redis_secret@redis:6379
      JWT_SECRET: change_me_in_production
      FRONTEND_URL: http://localhost:3000
      ANDROID_IMAGES_PATH: /android/images
      ANDROID_BASE_IMG: /android/base/android-x86-9.0.img
      MAX_EMULATORS: 20
      WORKER_CONCURRENCY: 5
      AUTO_RESTART: "true"
    volumes:
      - android_images:/android/images
      - android_base:/android/base
      - screenshots:/app/screenshots
      - apk_store:/app/apks
    ports:
      - "4000:4000"
      - "5900-5950:5900-5950"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: pfarm-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
    command: sh -c "npm install && npm run build && npm start"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  android_images:
  android_base:
  screenshots:
  apk_store:
