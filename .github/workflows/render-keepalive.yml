name: Keep Render backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake and verify Render health endpoint
        env:
          HEALTH_URL: https://vpfarm-backend.onrender.com/health
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location \
            --connect-timeout 20 --max-time 90 \
            -H 'Cache-Control: no-cache' \
            -H 'User-Agent: PhoneFarmZone-Render-KeepAlive/1.0' \
            "$HEALTH_URL")"
          echo "$response"
          echo "$response" | grep -q '"ok":true'
          echo "Render backend is healthy."
