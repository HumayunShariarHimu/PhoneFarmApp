name: Keep Render backend warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            -H 'Cache-Control: no-cache' \
            https://vpfarm-backend.onrender.com/health
          echo
