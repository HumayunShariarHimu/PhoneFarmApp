services:
  - type: web
    name: vpfarm-backend
    env: node
    rootDir: backend
    buildCommand: npm install --no-audit --no-fund
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_ACTIVE
        value: 3
      - key: SCREENSHOT_INTERVAL
        value: 800
      - key: ENABLE_BROWSER_EVAL
        value: "false"
      - key: FRONTEND_URL
        sync: false
      - key: FARM_PASSWORD
        sync: false
      - key: FARM_SESSION_SECRET
        generateValue: true
